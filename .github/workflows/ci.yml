name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Run synthetic studies (smoke test)
        working-directory: examples
        run: |
          python 01_overfitting.py
          python 02_survivorship.py
          python 03_planted_signal.py
          python 05_capacity.py
